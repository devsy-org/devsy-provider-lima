version: "3"

tasks:
  build:cli:
    desc: Cross-compile the provider binaries into ./dist
    cmds:
      - goreleaser release --snapshot --clean

  build:provider:dev:
    desc: Generate a provider.yaml pointing at local ./dist binaries
    deps: ["build:cli"]
    env:
      PROJECT_ROOT: ./dist
    cmd: go run ./hack/provider/main.go v0.0.0 > ./dist/provider.yaml

  build:provider:release:
    desc: Generate a provider.yaml pointing at GitHub release assets
    env:
      GITHUB_OWNER: devsy-org
    cmd: go run ./hack/provider/main.go {{ .VERSION }} > ./dist/provider.yaml
    vars:
      VERSION:
        sh: git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0"

  test:
    desc: Run unit tests
    cmd: go test ./...

  test:e2e:
    desc: Run no-VM e2e integration tests
    deps: ["build:cli"]
    dir: e2e
    cmd: go test -v -ginkgo.v -timeout 3600s --ginkgo.label-filter=integration

  test:e2e:vm:
    desc: Run full VM-lifecycle e2e tests (requires limactl + virtualization)
    deps: ["build:cli"]
    dir: e2e
    cmd: go test -v -ginkgo.v -timeout 3600s --ginkgo.label-filter=vm

  lint:
    desc: Run go vet
    cmd: go vet ./...
